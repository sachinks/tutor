name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: tutor
          POSTGRES_DB: tutor_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgresql://tutor:tutor@localhost:5432/tutor_ci
      DJANGO_LOG_LEVEL: ERROR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint and format check
        run: ruff check . && ruff format --check .
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate
        run: python manage.py migrate && python manage.py createcachetable
      - name: Django checks
        run: python manage.py check
      - name: Production settings pass Django's deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          # Placeholder values shaped like production ones; nothing here is a real secret.
          DJANGO_SECRET_KEY: ci-deploy-check-${{ github.run_id }}-long-random-looking-value-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: api.tutor.org.in
          DJANGO_CSRF_TRUSTED_ORIGINS: https://tutor.org.in
          DJANGO_COOKIE_DOMAIN: .tutor.org.in
          DJANGO_HSTS_SECONDS: "31536000"
          TUTOR_TRUSTED_PROXIES: "1"
        run: python manage.py check --deploy --fail-level WARNING
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Tests with coverage (minimum in pyproject.toml)
        run: coverage run manage.py test apps --settings=config.settings.test && coverage report

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/migrations/**", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
# Seed data and tests hold long human-readable strings.
"**/management/commands/seed_*.py" = ["E501"]
"**/tests.py" = ["E501"]
"**/test_*.py" = ["E501"]

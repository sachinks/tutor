# Render Blueprint — https://docs.render.com/infrastructure-as-code
#
# Defines the Django platform service and the FastAPI AI service. Deploy by connecting the GitHub repo to Render
# and selecting this file.
#
# Prerequisites (set up manually before first deploy):
#   1. Create a Neon database (free tier) and copy the connection string.
#   2. Connect this repo to Render (Dashboard → New → Blueprint → select repo).
#   3. Render will prompt you to fill in the sync'd env vars below.

services:
  # ── Django platform ────────────────────────────────────────────
  - type: web
    name: tutor-platform
    runtime: python
    plan: free
    region: singapore  # closest to Kolkata
    branch: main
    autoDeployTrigger: checksPass  # deploy only after GitHub CI is green, never on a red commit
    healthCheckPath: /api/v1/health  # a new version goes live only if it answers here (app up + database reachable)
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true  # Render generates a random secret
      - key: DJANGO_ALLOWED_HOSTS
        sync: false  # you fill this in: e.g. tutor-platform.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false  # e.g. https://tutor-platform.onrender.com
      - key: DATABASE_URL
        sync: false  # paste your Neon connection string
      - key: TUTOR_TRUSTED_PROXIES
        value: "1"
      - key: TUTOR_DEV_TOOLS
        value: "false"
      - key: TUTOR_DEMO_DATA
        value: "true"  # demo/staging only; production must not load demo content
      - key: TUTOR_DEMO_PASSWORD
        sync: false  # shared password of all demo accounts; give it to testers privately, never commit it
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false  # first admin, created once by build.sh (ensure_superuser)
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false  # strong password; lives only in Render. Change it in /admin after first login
      - key: TUTOR_AI_URL
        sync: false  # https://<tutor-ai service>.onrender.com ; empty = no tutor (503 feature_unavailable)
      - key: TUTOR_AI_SERVICE_TOKEN
        sync: false  # same value as on tutor-ai

  # ── FastAPI AI service (milestone 5, D41) ───────────────────
  # Free instances can't receive private-network traffic, so on the hosted demo Django calls this service's public
  # https URL; every /v1 call needs the service token, /health reveals only up/down, and the API docs are off
  # (TUTOR_ENV=hosted). Production moves to a paid instance on the private network.
  - type: web
    name: tutor-ai
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    rootDir: ai
    healthCheckPath: /health
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn tutor_ai.main:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: TUTOR_ENV
        value: hosted  # refuses Ollama, hides the API docs
      - key: TUTOR_AI_PROVIDER
        value: mock  # deterministic demo tutor: no model, no key, no cost
      - key: TUTOR_TRUSTED_PROXIES
        value: "1"
      - key: AI_DATABASE_URL
        sync: false  # Neon direct connection string of the tutor_ai role (schema ai only, M7)
      - key: TUTOR_AI_SERVICE_TOKEN
        sync: false  # same value as on tutor-platform; at least 32 random characters
